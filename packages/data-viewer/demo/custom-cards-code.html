<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>data-viewer, custom cards from code</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--dv-bg); color: var(--dv-text); }
    h2 { font-size: 1.1rem; }
    .dv-card-custom {
      display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem;
      background: var(--dv-surface); border: 1px solid var(--dv-border); border-radius: var(--dv-radius);
    }
    .dv-card-custom [data-open] { all: unset; cursor: pointer; font-weight: 600; }
    .dv-card-custom p { margin: 0; }
  </style>
</head>
<body>
  <h1>data-viewer, custom cards from code</h1>
  <h2>cardTemplate returning Lit</h2>
  <lfdln-data-viewer id="lit" label="Plants" layout="cards"></lfdln-data-viewer>
  <h2>cardTemplate returning an element</h2>
  <lfdln-data-viewer id="dom" label="Plants" layout="cards"></lfdln-data-viewer>
  <h2>cardMount (two per page)</h2>
  <div id="mount-box"><lfdln-data-viewer id="mount" label="Plants" layout="cards" page-size="2"></lfdln-data-viewer></div>
  <h2>cardMount over cardTemplate over a template child</h2>
  <lfdln-data-viewer id="order" label="Plants" layout="cards"></lfdln-data-viewer>
  <script type="module" src="./custom-cards-code.ts"></script>
</body>
</html>
