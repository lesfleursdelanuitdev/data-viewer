<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>data-viewer, menus</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--dv-bg); color: var(--dv-text); }
    h2 { font-size: 1.1rem; }
    .bar { display: flex; gap: 1rem; align-items: center; }
  </style>
</head>
<body>
  <h1>data-viewer, menus</h1>
  <h2>Row menus with icons, descriptions and a heading</h2>
  <lfdln-data-viewer id="rich" label="Files" layout="table"></lfdln-data-viewer>
  <lfdln-data-viewer id="rich-cards" label="Files as cards" layout="cards"></lfdln-data-viewer>
  <h2>A menu on its own, HTML only</h2>
  <div class="bar">
    <span>A page</span>
    <lfdln-dv-menu id="m1" label="More for this page">
      <lfdln-dv-menu-item value="edit" description="Change the words and pictures"><svg class="pen" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 14l1-4 8-8 3 3-8 8z" fill="none" stroke="currentColor"/></svg> Edit</lfdln-dv-menu-item>
      <lfdln-dv-menu-item value="history" href="#history" icon="🕘">See its history</lfdln-dv-menu-item>
      <lfdln-dv-menu-heading>Share</lfdln-dv-menu-heading>
      <lfdln-dv-menu-item value="mail" icon="✉️">By email</lfdln-dv-menu-item>
      <lfdln-dv-menu-item value="print" disabled why="No printer is set up" description="On paper">Print</lfdln-dv-menu-item>
      <lfdln-dv-menu-separator></lfdln-dv-menu-separator>
      <lfdln-dv-menu-item value="delete" danger confirm="Delete this page?" icon="🗑️">Delete</lfdln-dv-menu-item>
    </lfdln-dv-menu>
  </div>
  <h2>A menu on its own, from script</h2>
  <div class="bar">
    <lfdln-dv-menu id="m2" label="Sort by" trigger-text></lfdln-dv-menu>
  </div>
  <script type="module" src="./menus.ts"></script>
</body>
</html>
