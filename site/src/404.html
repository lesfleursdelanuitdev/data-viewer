<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · data-viewer</title>
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
<div class="l-page">
  <nav class="l-wrap l-nav" aria-label="Site">
    <a class="brand" href="/">
      {{logo}}
      <span class="brand-name">data-viewer</span>
    </a>
    <a href="/docs/" class="btn btn-primary">Read the docs</a>
  </nav>
  <main class="l-wrap">
    <section class="nf">
      <div class="l-kicker">Not found</div>
      <h1>There’s no page at this address</h1>
      <p class="l-copy">It may have moved when the site got one page per topic. The docs list every page.</p>
      <div class="btn-row">
        <a href="/docs/" class="btn btn-primary nowrap">Go to the docs</a>
        <a href="/" class="btn btn-secondary nowrap">Home</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
